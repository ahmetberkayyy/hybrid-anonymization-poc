[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-anon-poc"
version = "0.1.0"
description = "Turkish insurance text anonymization proof of concept"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
models = ["gliner>=0.2", "transformers>=4.51,<5.17", "torch>=2.0", "protobuf>=4"]
analysis = ["jupyterlab>=4", "ipykernel>=6", "pandas>=2", "matplotlib>=3.8"]

[project.scripts]
hybrid-anon = "hybrid_anon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
